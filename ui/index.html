<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Taskvasne</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="title">Taskvasne</div>
      <div class="header-actions">
        <button id="refresh" class="icon-btn" title="Atualizar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
        <button id="about" class="icon-btn" title="Sobre">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </button>
        <button id="quit" class="icon-btn danger" title="Sair">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
    <div id="status-banner" class="status-banner">
      <span class="pulse-dot"></span>
      <span id="status-text">Taskvasne ativo na bandeja do sistema</span>
      <button id="close-status" class="status-close-btn" title="Fechar aviso">×</button>
    </div>
    <div class="category-filters" id="category-filters">
      <button class="filter-pill active" data-category="all">Todos <span class="pill-count" id="count-all">0</span></button>
      <button class="filter-pill" data-category="dev">⚡ Dev <span class="pill-count" id="count-dev">0</span></button>
      <button class="filter-pill" data-category="database">🗄️ Bancos <span class="pill-count" id="count-database">0</span></button>
      <button class="filter-pill" data-category="app">📦 Apps <span class="pill-count" id="count-app">0</span></button>
      <button class="filter-pill" data-category="system">🛡️ Sistema <span class="pill-count" id="count-system">0</span></button>
    </div>
    <div id="port-list" class="port-list">
      <!-- Items will be injected here -->
    </div>

    <!-- Modal Sobre -->
    <div id="about-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="about-header">
          <img src="icon.png" class="about-icon" alt="Taskvasne" />
          <h2 class="about-title">Taskvasne</h2>
          <span class="about-version">v0.1.1</span>
        </div>
        <p class="about-desc" id="about-desc">Gerenciador de portas minimalista para Windows.</p>
        <div class="about-links">
          <button class="link-btn" data-url="https://kvasne.com">Website</button>
          <button class="link-btn" data-url="https://github.com/rkvasne/taskvasne">GitHub</button>
          <button class="link-btn" data-url="https://linkedin.com/in/rkvasne">LinkedIn</button>
        </div>
        <p class="about-author" id="about-author">Desenvolvido por Raphael Kvasne.</p>
        <button id="close-about" class="btn-close">Fechar</button>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
